services:
  - type: web
    name: primesub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ACCESS_CODES
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CODE_MINUTES
        value: "30"
      - key: MAX_VIDEO_MINUTES
        value: "5"
      - key: USD_INR
        value: "90"
